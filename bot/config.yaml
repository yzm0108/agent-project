# ===== 多平台 Bot 配置文件 =====
# 所有密钥也可以通过环境变量传入（优先级更高）

feishu:
  # 从飞书开放平台获取: https://open.feishu.cn/
  app_id: "${FEISHU_APP_ID}"
  app_secret: "${FEISHU_APP_SECRET}"
  # 长连接模式已不使用；保留字段兼容旧配置
  port: 8888

wecom:
  # 从企业微信管理后台获取: 智能机器人 → API 模式 → 长连接
  bot_id: "${WECOM_BOT_ID}"
  secret: "${WECOM_BOT_SECRET}"
